# After master's CI passes, Claude fixes the docs that what's new made wrong, in a pull request. The workflow is
# Raineworks', in raine-works/agents (.github/workflows/docs-sync.yml): this file only calls it, and comes from the raineworks-base
# skill's templates/workflows/docs-sync.yml. Change the workflow there, for every repository at once; here, only its
# inputs (with:). The Base rules check moves the pin when the shared workflows change.
name: Docs sync

on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write
  actions: read

jobs:
  docs-sync:
    name: Docs sync
    uses: raine-works/agents/.github/workflows/docs-sync.yml@8ef4df2732bff8e05f06fd3c99a6d0f9da572f1c # raine-works/agents master
    secrets: inherit
    with:
      # docs/reference/ is written from the code (bun scripts/docs.ts, checked by docs.test.ts), so an edit there
      # by hand fails the tests; its words live in the integration's strings and lib/modules.ts
      docs: >-
        AGENTS.md, README.md and docs/*.md. Never edit docs/reference/: its pages are written from the code by
        bun scripts/docs.ts, and docs.test.ts fails when one differs from it. If one is wrong, leave it and say
        so in the pull request (its words come from custom_components/raineworks_dashboards/strings.json and
        packages/ui/src/lib/modules.ts).
