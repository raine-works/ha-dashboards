# Publishes a GitHub release when the integration's manifest version changes on master, with
# raineworks_dashboards.zip (hacs.json's zip_release): the integration with the dashboards bundle
# built into its www/. Runs only after the Test workflow passes, only if the tag is new, and only
# once the repository is public.
name: "Release"

on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]
    branches: [master]

permissions:
  contents: write
  # npm's trusted publishing: the job's OIDC token, no npm token stored
  id-token: write

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      !github.event.repository.private
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Is this version new?
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(jq -r .version custom_components/raineworks_dashboards/manifest.json)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to do."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.new == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - name: Build the bundle into the integration
        if: steps.version.outputs.new == 'true'
        run: |
          bun install --frozen-lockfile
          bun run build:integration
      # The npm package (packages/kit: the house settings parser, bedtime routines and setup MCP that a house's own
      # config repository uses), the same version as the integration, with provenance. Published with npm's trusted
      # publishing (this workflow is the package's trusted publisher on npmjs.com); the NPM_TOKEN secret is only for
      # the first publish, before the package exists to name one, and is deleted after. It goes before the GitHub
      # release, so a publish that fails leaves no release behind and a re-run tries both again; a version already
      # on npm (a re-run after the release itself failed) is skipped.
      - name: Build the npm package
        if: steps.version.outputs.new == 'true'
        run: bun run --cwd packages/kit build
      - if: steps.version.outputs.new == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          registry-url: https://registry.npmjs.org
      - name: Publish the npm package
        if: steps.version.outputs.new == 'true'
        working-directory: packages/kit
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm install -g npm@11.21.2
          name="$(jq -r .name package.json)" version="$(jq -r .version package.json)"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm."
          else
            npm publish --access public --provenance
          fi
      - name: Create the release with the integration's zip
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          (cd custom_components/raineworks_dashboards && zip -qr "$GITHUB_WORKSPACE/raineworks_dashboards.zip" . -x '__pycache__/*')
          gh release create "$TAG" raineworks_dashboards.zip --target "$SHA" --title "$TAG" --generate-notes
