# Validates the integration against Home Assistant (hassfest) and the Marketplace's rules (hacs/action:
# the Home Assistant Marketplace is HACS, built in).
name: "Validate"

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    # Catch upstream hassfest/Marketplace rule changes weekly.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Hassfest
        uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master
  hacs:
    # The Marketplace reads the repository's description, topics and releases, which need it public: until the
    # public release it runs only on demand
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Marketplace validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
