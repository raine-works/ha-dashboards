name: Bug report
description: Something in the dashboards or the integration doesn't work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      placeholder: "1. Open the Home dashboard on a phone\n2. …"
  - type: input
    id: version
    attributes:
      label: Raineworks Dashboards version
      description: Settings → Devices & services → Raineworks Dashboards, or HACS
    validations:
      required: true
  - type: input
    id: ha
    attributes:
      label: Home Assistant version
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where you saw it
      placeholder: Home dashboard in Chrome on a desktop / Companion app on Android / a wall panel (which tablet)
  - type: textarea
    id: logs
    attributes:
      label: Logs or the browser console
      description: Anything from Settings → System → Logs, or the browser's console. Leave out tokens and anything personal.
      render: text
