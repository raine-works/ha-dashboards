<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Raineworks Dashboards: the integration's brand icons (custom_components/raineworks_dashboards/brand/) are rendered
       from this (scripts/render-brand.ts). A roof over a dashboard's tiles, one lit in the Raineworks theme's
       peach-to-teal gradient, on a black tile with the gradient's edge and a soft teal glow. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ea9a7e"/>
      <stop offset="0.5" stop-color="#a6a69a"/>
      <stop offset="1" stop-color="#2998ad"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ea9a7e" stop-opacity=".6"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".06"/>
      <stop offset="1" stop-color="#2998ad" stop-opacity=".6"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".66" r=".55">
      <stop offset="0" stop-color="#2998ad" stop-opacity=".3"/>
      <stop offset="1" stop-color="#2998ad" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#0b0b0c"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <rect x="3" y="3" width="506" height="506" rx="109" fill="none" stroke="url(#edge)" stroke-width="6"/>
  <path d="M104 228 L256 106 L408 228" fill="none" stroke="url(#g)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="142" y="236" width="106" height="82" rx="20" fill="url(#g)"/>
  <rect x="274" y="244" width="90" height="66" rx="14" fill="none" stroke="#fff" stroke-width="16"/>
  <rect x="150" y="346" width="90" height="66" rx="14" fill="none" stroke="#fff" stroke-width="16"/>
  <rect x="274" y="346" width="90" height="66" rx="14" fill="none" stroke="#fff" stroke-width="16"/>
</svg>
